name: treeview
version: 0.19.4 # SilverBullet v2 compatible
description: Displays a hierarchical tree view of tags and associated pages.
assets:
  - "assets/**/*.*"
functions:
  # API - Tag Tree
  hide:
    path: "./treeview.ts:hideTree"
  show:
    path: "./treeview.ts:showTree"
  showIfEnabled:
    path: "./treeview.ts:showTreeIfEnabled"
    events:
      - editor:init
      - editor:pageLoaded
  # Debounced refresh on save (coalesces bursts of saves into one rebuild and
  # invalidates the cached tag tree, since a save may add/remove tags)
  refreshOnSave:
    path: "./treeview.ts:refreshOnSave"
    events:
      - editor:pageSaved
  # Deleting a page can remove its tags; invalidate the cache and refresh
  refreshOnDelete:
    path: "./treeview.ts:refreshOnDelete"
    events:
      - file:deleted

  # User facing command - Tag Tree
  toggle:
    path: "./treeview.ts:toggleTree"
    command:
      name: "Tag Tree: Toggle"
      key: Ctrl-alt-b
      mac: Cmd-alt-b

  # Switch between views
  switchView:
    path: "./treeview.ts:switchView"

  # User facing command - Outline View
  toggleOutline:
    path: "./treeview.ts:toggleOutline"
    command:
      name: "Outline: Toggle"
      key: Ctrl-alt-o
      mac: Cmd-alt-o

  # User facing command - report the plug version
  version:
    path: "./treeview.ts:showVersion"
    command:
      name: "Tag Tree: Version"

  # User facing command - rename a tag (and its children) across the space
  renameTag:
    path: "./treeview.ts:renameTag"
    command:
      name: "Tag Tree: Rename Tag"

